[project]
name = "usher-library-backend"
version = "0.1.0"
description = "Backend for the Usher Library collaborative reading platform."
requires-python = ">=3.12"
readme = "../README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    # ``sqlalchemy[asyncio]`` pulls in the ``greenlet`` library, which is
    # required by ``sqlalchemy.ext.asyncio`` since SQLAlchemy 2.1. Without
    # it the online branch of Alembic (``alembic upgrade head``) fails with
    # ``ImportError: The SQLAlchemy asyncio module requires that the
    # Python 'greenlet' library is installed.`` RF-4 / plan §5.1.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # FastAPI / Starlette still emits a deprecation warning about
    # `on_event` that does not affect this scaffold; ignore it so the
    # test run is green for T2. Revisit when the lifecycle API is used.
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# Reasonable default rule set: pycodestyle, pyflakes, isort, pyupgrade,
# bugbear and comprehensions. We can refine in a later spec.
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
]
ignore = [
    # Allow asserts in tests; they document the contract.
    "B011",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
