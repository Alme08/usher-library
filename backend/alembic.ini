# Alembic configuration for the Usher Library backend.
#
# The ``sqlalchemy.url`` setting here is a placeholder. The real
# database URL is read from the application settings (which in turn
# read the ``DATABASE_URL`` environment variable) inside ``env.py``.
# Keeping the placeholder in the ini file is the standard Alembic
# pattern: it lets developers inspect the file without leaking real
# credentials, while the env.py file is the single source of truth at
# runtime (RF-17).

[alembic]
# Path to the migration scripts. The ``%(here)s`` token resolves to
# the directory containing this ini file (``backend/``), so the
# ``alembic/`` directory below is the script directory.
script_location = %(here)s/alembic

# Make the ``backend/`` directory importable so ``env.py`` can import
# ``app.core.config`` and the SQLAlchemy models. Without this, the
# env would only see Alembic's vendored paths and the import would
# fail.
prepend_sys_path = .

# Path separator. ``os`` is the default and uses ``os.pathsep``,
# which is what Alembic 1.10+ expects.
path_separator = os

# The ``sqlalchemy.url`` value is overridden in ``env.py`` from the
# application settings. Do NOT put a real connection string here:
# the ini file is tracked by git (RF-2, RF-17).
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logger configuration; ``env.py`` only configures the root logger.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
